apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-charts
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/iliesbenyahia/homeops.git
      revision: HEAD
      directories:
      - path: apps/local-charts/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "default"
      sources:
      - repoURL: https://github.com/iliesbenyahia/homeops.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
