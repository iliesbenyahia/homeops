# ---------------------------------------------------------------------------
# generic-app : chart générique
#
# Chaque famille de ressources est une MAP nommée. La clé devient le nom de la
# ressource Kubernetes (surchargeable via le champ `name`). Exemple :
#   deployments.web  -> Deployment "web"
#   services.web     -> Service "web" (cible par défaut le deployment "web")
#
# Pour désactiver une ressource dans un override : `enabled: false`
# (ou la mettre à `null`, Helm la supprime de la map).
# ---------------------------------------------------------------------------

global:
  # Labels / annotations ajoutés à TOUTES les ressources
  labels: {}
  annotations: {}

  # imagePullSecrets par défaut (surchargeable par deployment)
  imagePullSecrets: []
  #  - name: registry-creds


  argocd:
    # Ajoute la sync-wave "-1" aux ConfigMaps et ExternalSecrets pour qu'ils
    # soient créés avant les Deployments. (Les PVC n'ont volontairement pas de
    # wave : un PVC WaitForFirstConsumer reste Pending et bloquerait la wave.)
    syncWaves: true
    
  # Profils d'exposition, utilisés par services.<clé>.expose.type
  expose:
    defaultProfile: lan
    profiles:
      lan:
        entryPoints: [websecure]     # entrypoint Traefik dédié au LAN
        domain: "ibenyahia.fr"                       # <-- À RENSEIGNER (ex: home.example.com)
        middlewares: []                  # appliqués à toutes les routes du profil
        redirect:                        # redirection http -> https
          entryPoints: [web]         # entrypoint HTTP du LAN
          # enabled: false               # pour désactiver la redirection
        certificate:
          issuerRef:
            name: "letsencrypt-cloudflare"                     # <-- À RENSEIGNER (ex: letsencrypt-dns)
            kind: ClusterIssuer
      public:
        entryPoints: [websecure-pub]
        domain: "ibenyahia.fr"                       # <-- À RENSEIGNER (ex: example.com)
        middlewares: []
        redirect:
          entryPoints: [web-pub]             # entrypoint HTTP public
        certificate:
          issuerRef: 
            name: "letsencrypt-cloudflare"
            kind: ClusterIssuer

  externalSecrets:
    apiVersion: external-secrets.io/v1
    refreshInterval: 1h
    # Store commun, surchargeable par ExternalSecret (fusion champ par champ)
    secretStoreRef:
      name: bitwarden-secretsmanager       # <-- À RENSEIGNER (ex: vault-backend)
      kind: ClusterSecretStore

