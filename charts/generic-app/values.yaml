# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services: {}
  # web:
  #   enabled: true
  #   type: ClusterIP
  #   deployment: web              # défaut = même clé que le service
  #   create: true                 # false = ne génère PAS le Service (il existe déjà),
  #                                # mais génère quand même expose (IngressRoute, Certificate...).
  #                                # Dans ce cas : `name` = nom du Service existant si différent
  #                                # de la clé, et expose.port est obligatoire.
  #   # selector: {}               # remplace la sélection automatique
  #   labels: {}
  #   annotations: {}
  #   ports:
  #     - name: http
  #       port: 80
  #       targetPort: http         # défaut = port
  #       protocol: TCP
  #
  #   # Exposition : crée une IngressRoute + un Certificate cert-manager.
  #   # Forme courte : expose: lan   (ou expose: public, ou expose: true = profil par défaut)
  #   # Plusieurs expositions (ex: LAN + public, domaines différents) : expose devient une liste.
  #   # Les ressources sont alors nommées <service>-<type> (ou <service>-<id> si `id` est fourni).
  #   expose:
  #     - lan                      # -> <service>.<domaine lan>
  #     - type: public
  #       host: www                # -> www.<domaine public>
  #
  #   # Exposition unique, forme détaillée :
  #   expose:
  #     type: lan                  # nom d'un profil de global.expose.profiles
  #     host: web                  # sous-domaine, défaut = clé du service -> web.<domain>
  #     # hostname: web.autre.tld  # FQDN complet (ignore host et domain)
  #     # domain: autre.tld        # remplace le domaine du profil
  #     # port: 80                 # port du backend, défaut = 1er port du service
  #     # entryPoints: [websecure] # remplace ceux du profil
  #     # middlewares:             # s'ajoutent à ceux du profil
  #     #   - name: security-headers
  #     # tls: {}                  # champs tls supplémentaires (ex: options)
  #     # redirect:
  #     #   enabled: false         # pas de redirection http -> https pour ce service
  #     #   entryPoints: [web]     # remplace ceux du profil
  #     # certificate:
  #     #   enabled: false         # pas de Certificate (tls sans secretName)
  #     #   secretName: web-tls    # défaut = <service>-tls
  #     #   issuerRef: { name: autre-issuer, kind: ClusterIssuer }
  #     #   duration: 2160h        # tout champ de Certificate.spec est accepté

# ---------------------------------------------------------------------------
