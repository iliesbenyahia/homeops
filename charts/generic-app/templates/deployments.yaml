{{- range $key, $d := .Values.deployments }}
{{- if include "app.enabled" $d }}
{{- $name := include "app.name" (list $key $d) }}
{{- $imagePullSecrets := default $.Values.global.imagePullSecrets $d.imagePullSecrets }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $d.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $d.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ ternary 1 $d.replicas (kindIs "invalid" $d.replicas) }}
  revisionHistoryLimit: {{ ternary 3 $d.revisionHistoryLimit (kindIs "invalid" $d.revisionHistoryLimit) }}
  {{- with $d.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" (dict "root" $ "name" $name "extra" $d.podLabels) | nindent 8 }}
      {{- $podAnnotations := default (dict) $d.podAnnotations | deepCopy }}
      {{- range $cmKey := default (list) $d.checksumConfigMaps }}
        {{- $cm := index $.Values.configMaps $cmKey }}
        {{- if not $cm }}{{ fail (printf "deployments.%s.checksumConfigMaps: configMap %q introuvable" $key $cmKey) }}{{ end }}
        {{- $_ := set $podAnnotations (printf "checksum/configmap-%s" $cmKey) (toYaml $cm | sha256sum) }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $d.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if not (kindIs "invalid" $d.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ $d.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $d.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ default $name $d.containerName }}
          image: {{ include "app.image" (required (printf "deployments.%s.image est requis" $key) $d.image) | quote }}
          {{- $pullPolicy := default "IfNotPresent" $d.imagePullPolicy }}
          {{- if kindIs "map" $d.image }}
            {{- if $d.image.pullPolicy }}{{ $pullPolicy = $d.image.pullPolicy }}{{ end }}
          {{- end }}
          imagePullPolicy: {{ $pullPolicy }}
          {{- with $d.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.workingDir }}
          workingDir: {{ . }}
          {{- end }}
          {{- with $d.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $d.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with $d.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $d.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.enableServiceLinks }}
      enableServiceLinks: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
