{{- /*
Pour chaque service portant un bloc `expose`, génère pour chaque exposition :
  - une IngressRoute HTTPS Traefik (Host(`<host>.<domain>`) -> le service)
  - un Certificate cert-manager (sauf certificate.enabled: false)
  - une IngressRoute HTTP + un Middleware de redirection vers HTTPS (sauf redirect.enabled: false)
`expose` peut être : une chaîne (lan), true, un objet, ou une LISTE de ces formes
(plusieurs expositions du même service, ex: lan + public).
Les paramètres viennent du profil (global.expose.profiles.<type>), surchargeables par exposition.
*/ -}}
{{- $g := .Values.global.expose }}
{{- range $key, $s := .Values.services }}
{{- if include "app.enabled" $s }}
{{- $name := include "app.name" (list $key $s) }}

{{- /* Normalisation de expose en liste d'expositions */ -}}
{{- $raw := $s.expose }}
{{- $multi := kindIs "slice" $raw }}
{{- $exposures := list }}
{{- if $multi }}
  {{- $exposures = $raw }}
{{- else if or (kindIs "map" $raw) (kindIs "string" $raw) (and (kindIs "bool" $raw) $raw) }}
  {{- $exposures = list $raw }}
{{- end }}
{{- $seen := dict }}

{{- range $exposure := $exposures }}
{{- $x := $exposure }}
{{- if kindIs "string" $x }}{{ $x = dict "type" $x }}{{ end }}
{{- if kindIs "bool" $x }}{{ if $x }}{{ $x = dict }}{{ end }}{{ end }}
{{- if kindIs "map" $x }}
{{- if or (not (hasKey $x "enabled")) $x.enabled }}

{{- /* Profil */ -}}
{{- $type := default $g.defaultProfile $x.type }}
{{- $prof := index $g.profiles $type }}
{{- if not $prof }}
  {{- fail (printf "services.%s.expose : profil %q inconnu (profils disponibles : %s)" $key $type (keys $g.profiles | sortAlpha | join ", ")) }}
{{- end }}

{{- /* Nom des ressources : <service>, ou <service>-<type> (ou -<id>) si plusieurs expositions */ -}}
{{- $resName := $name }}
{{- if $multi }}{{ $resName = printf "%s-%s" $name (default $type $x.id) }}{{ end }}
{{- if hasKey $seen $resName }}
  {{- fail (printf "services.%s.expose : deux expositions produisent le même nom %q (ajouter un champ 'id' unique à l'une d'elles)" $key $resName) }}
{{- end }}
{{- $_ := set $seen $resName true }}

{{- /* Entrypoints */ -}}
{{- $entryPoints := default $prof.entryPoints $x.entryPoints }}
{{- if not $entryPoints }}
  {{- fail (printf "services.%s.expose : aucun entryPoint (global.expose.profiles.%s.entryPoints ou services.%s.expose.entryPoints)" $key $type $key) }}
{{- end }}

{{- /* Hostname */ -}}
{{- $domain := default $prof.domain $x.domain }}
{{- $host := $x.hostname }}
{{- if not $host }}
  {{- if not $domain }}
    {{- fail (printf "services.%s.expose : aucun domaine (global.expose.profiles.%s.domain, services.%s.expose.domain ou .hostname)" $key $type $key) }}
  {{- end }}
  {{- $host = printf "%s.%s" (default $key $x.host) $domain }}
{{- end }}

{{- /* Port du backend : port explicite, sinon premier port du service */ -}}
{{- $port := $x.port }}
{{- if not $port }}
  {{- if not $s.ports }}
    {{- fail (printf "services.%s.expose : 'port' requis quand le service n'a pas de 'ports' (ex: avec create: false)" $key) }}
  {{- end }}
  {{- $port = (index $s.ports 0).port }}
{{- end }}

{{- /* Middlewares : ceux du profil + ceux de l'exposition */ -}}
{{- $middlewares := concat (default (list) $prof.middlewares) (default (list) $x.middlewares) }}

{{- /* Certificat */ -}}
{{- $svcCert := default (dict) $x.certificate }}
{{- $profCert := default (dict) $prof.certificate }}
{{- $certEnabled := true }}
{{- if hasKey $svcCert "enabled" }}{{ $certEnabled = $svcCert.enabled }}
{{- else if hasKey $profCert "enabled" }}{{ $certEnabled = $profCert.enabled }}{{ end }}
{{- $cert := merge (dict) $svcCert $profCert }}
{{- $secretName := default (printf "%s-tls" $resName) $cert.secretName }}

{{- /* Redirection HTTP -> HTTPS */ -}}
{{- $svcRedirect := default (dict) $x.redirect }}
{{- $profRedirect := default (dict) $prof.redirect }}
{{- $redirectEnabled := true }}
{{- if hasKey $svcRedirect "enabled" }}{{ $redirectEnabled = $svcRedirect.enabled }}
{{- else if hasKey $profRedirect "enabled" }}{{ $redirectEnabled = $profRedirect.enabled }}{{ end }}
{{- $redirectEntryPoints := default $profRedirect.entryPoints $svcRedirect.entryPoints }}
{{- if and $redirectEnabled (not $redirectEntryPoints) }}
  {{- fail (printf "services.%s.expose : redirect.entryPoints requis (global.expose.profiles.%s.redirect.entryPoints) ou redirect.enabled: false" $key $type) }}
{{- end }}

{{- /* Bloc tls de l'IngressRoute */ -}}
{{- $tls := default (dict) $x.tls }}
{{- if $certEnabled }}{{ $tls = merge (dict) $tls (dict "secretName" $secretName) }}{{ end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $resName }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $x.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $x.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml $entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" $host | quote }}
      {{- with $middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ $name }}
          port: {{ $port }}
  tls:
    {{- toYaml $tls | nindent 4 }}
{{- if $certEnabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $resName }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $x.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $cert.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ $secretName }}
  dnsNames:
    - {{ $host | quote }}
  issuerRef:
    {{- toYaml (required (printf "services.%s.expose : issuerRef requis (global.expose.profiles.%s.certificate.issuerRef)" $key $type) $cert.issuerRef) | nindent 4 }}
  {{- with omit $cert "enabled" "secretName" "issuerRef" "dnsNames" "annotations" }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- if $redirectEnabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $resName }}-redirect-https
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $x.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $x.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $resName }}-http
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $x.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $x.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml $redirectEntryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" $host | quote }}
      middlewares:
        - name: {{ $resName }}-redirect-https
      services:
        - name: noop@internal
          kind: TraefikService
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}