{{- $g := .Values.global.externalSecrets }}
{{- range $key, $e := .Values.externalSecrets }}
{{- if include "app.enabled" $e }}
{{- $name := include "app.name" (list $key $e) }}
{{- $store := merge (dict) (default (dict) $e.secretStoreRef) (default (dict) $g.secretStoreRef) }}
{{- if not $store.name }}
  {{- fail (printf "externalSecrets.%s : aucun store défini (renseigner global.externalSecrets.secretStoreRef.name ou externalSecrets.%s.secretStoreRef.name)" $key $key) }}
{{- end }}
{{- if not (or $e.data $e.dataFrom) }}
  {{- fail (printf "externalSecrets.%s : 'data' ou 'dataFrom' est requis" $key) }}
{{- end }}
{{- $target := merge (dict) (default (dict) $e.target) (dict "name" $name "creationPolicy" "Owner") }}
---
apiVersion: {{ default "external-secrets.io/v1" $g.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" (dict "root" $ "name" $name "extra" $e.labels) | nindent 4 }}
  {{- with include "app.annotations" (dict "root" $ "extra" $e.annotations "wave" "-1") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ default $g.refreshInterval $e.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    {{- toYaml $target | nindent 4 }}
  {{- with $e.data }}
  data:
    conversionStrategy: Default
    decodingStrategy: None
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $e.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
