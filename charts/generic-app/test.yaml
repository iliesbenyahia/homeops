---
# Source: generic-app/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  labels:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.2.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/part-of: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/part-of: release-name
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: generic-app-0.2.0
    spec:
      containers:
        - name: paperless
          image: "ghcr.io/paperless-ngx/paperless-ngx:3.1.3"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PAPERLESS_REDIS
              value: redis://broker:6379
            - name: PAPERLESS_DBENGINE
              value: sqlite
            - name: PAPERLESS_URL
              value: https://paperless.ibenyahia.fr
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: https://paperless.ibenyahia.fr
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
          envFrom:
            - secretRef:
                name: paperless-secret
          volumeMounts:
            - mountPath: /usr/src/paperless/data
              name: data
            - mountPath: /usr/src/paperless/media
              name: media
            - mountPath: /usr/src/paperless/export
              name: export
            - mountPath: /usr/src/paperless/consume
              name: consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume

---
# Source: generic-app/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.2.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: release-name
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: release-name
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: generic-app-0.2.0
    spec:
      containers:
        - name: valkey
          image: "valkey/valkey:9-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command:
              - valkey-cli
              - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
              - valkey-cli
              - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: valkey-data
      volumes:
        - emptyDir: {}
          name: valkey-data

