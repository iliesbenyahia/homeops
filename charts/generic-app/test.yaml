---
# Source: generic-app/templates/expose.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.3.2
spec:
  secretName: argocd-server-tls
  dnsNames:
    - "argocd.ibenyahia.fr"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare

---
# Source: generic-app/templates/expose.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.3.2
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`argocd.ibenyahia.fr`)"
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-server-tls

---
# Source: generic-app/templates/expose.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-http
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.3.2
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: "Host(`argocd.ibenyahia.fr`)"
      middlewares:
        - name: argocd-server-redirect-https
      services:
        - name: noop@internal
          kind: TraefikService
---
# Source: generic-app/templates/expose.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-server-redirect-https
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: release-name
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: generic-app-0.3.2
spec:
  redirectScheme:
    scheme: https
    permanent: true
