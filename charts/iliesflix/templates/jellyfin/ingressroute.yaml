
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure-pub
    - websecure
  routes:
    - match: "Host(`iliesflix.ibenyahia.fr`)"
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: iliesflix-tls
