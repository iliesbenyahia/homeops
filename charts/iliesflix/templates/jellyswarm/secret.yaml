apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyswarm-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.jellyswarm.auth.secretName }}
  data:
    - secretKey: JELLYSWARRM_USERNAME
      remoteRef:
        key: jellyswarrm-username
    - secretKey: JELLYSWARRM_PASSWORD
      remoteRef:
        key: jellyswarrm-password