apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyswarm-pub
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure-pub
    - websecure
  routes:
    - match: "Host(`copainflix.ibenyahia.fr`)"
      kind: Rule
      services:
        - name: jellyswarm
          port: 3000
  tls:
    secretName: iliesflix-tls