apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyswarm
  namespace: {{ .Release.Namespace }}
  labels:
    app: jellyswarm
    app.kubernetes.io/part-of: iliesflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyswarm
  template:
    metadata:
      labels:
        app: jellyswarm
    spec:
      containers:
        - name: jellyswarm
          image: ghcr.io/llukas22/jellyswarrm:0:3:1
          env:
            - name: JELLYSWARM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellyswarm.auth.secretName }}
                  key: JELLYSWARM_USERNAME
            - name: JELLYSWARM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellyswarm.auth.secretName }}
                  key: JELLYSWARM_PASSWORD
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iliesflix-jellyswarm-data
